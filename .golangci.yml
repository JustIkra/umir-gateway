version: "2"
run:
  tests: true
  relative-path-mode: cfg
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unconvert
    - errorlint
    - nilerr
    - nolintlint
    - depguard
    - bodyclose
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true
    depguard:
      rules:
        production-boundaries:
          list-mode: lax
          files: ["$all", "!$test"]
          deny:
            - pkg: "github.com/JustIkra/umir-gateway/tests/"
              desc: "Production must not import test support."
            - pkg: "github.com/JustIkra/umir-warehouse"
              desc: "Service modules interact through their declared boundary."
            - pkg: "github.com/JustIkra/umir-serving"
              desc: "Service modules interact through their declared boundary."
  exclusions:
    presets: []
formatters:
  enable:
    - gofmt
    - goimports
