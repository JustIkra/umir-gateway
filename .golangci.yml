version: "2"
run:
  tests: true
  relative-path-mode: cfg
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unconvert
    - errorlint
    - nilerr
    - nolintlint
    - depguard
    - bodyclose
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true
    depguard:
      rules:
        production-boundaries:
          list-mode: lax
          files: ["$all", "!$test", "!**/tests/fixtures/server/*.go", "!**/tests/fixtures/control/*.go", "!**/tests/fixtures/protocol/*.go", "!**/tests/fixtures/catalog/*.go", "!**/tests/fixtures/catalog/build/*.go"]
          deny:
            - pkg: "github.com/dlclark/regexp2$"
              desc: "Only fixture protocol schema compilation may use regexp2."
            - pkg: "github.com/JustIkra/umir-gateway/tests/"
              desc: "Production must not import test support."
            - pkg: "github.com/JustIkra/umir-warehouse"
              desc: "Service modules interact through their declared boundary."
            - pkg: "github.com/JustIkra/umir-serving"
              desc: "Service modules interact through their declared boundary."
        fixture-boundaries:
          list-mode: strict
          files: ["**/tests/fixtures/server/*.go", "**/tests/fixtures/control/*.go"]
          allow:
            - "$gostd"
            - "github.com/JustIkra/umir-gateway/internal/"
            - "github.com/JustIkra/umir-gateway/tests/fixtures/protocol$"
            - "github.com/JustIkra/umir-gateway/tests/fixtures/catalog$"
            - "github.com/santhosh-tekuri/jsonschema/v6$"
          deny:
            - pkg: "github.com/JustIkra/umir-warehouse"
              desc: "Service modules interact through their declared boundary."
            - pkg: "github.com/JustIkra/umir-serving"
              desc: "Service modules interact through their declared boundary."
        fixture-protocol-boundaries:
          list-mode: strict
          files: ["**/tests/fixtures/protocol/*.go"]
          allow:
            - "$gostd"
            - "github.com/dlclark/regexp2$"
            - "github.com/JustIkra/umir-gateway/internal/"
            - "github.com/JustIkra/umir-gateway/tests/fixtures/protocol$"
            - "github.com/JustIkra/umir-gateway/tests/fixtures/catalog$"
            - "github.com/santhosh-tekuri/jsonschema/v6$"
          deny:
            - pkg: "github.com/JustIkra/umir-warehouse"
              desc: "Service modules interact through their declared boundary."
            - pkg: "github.com/JustIkra/umir-serving"
              desc: "Service modules interact through their declared boundary."
        fixture-catalog-boundaries:
          list-mode: strict
          files: ["**/tests/fixtures/catalog/*.go", "**/tests/fixtures/catalog/build/*.go"]
          allow:
            - "$gostd"
            - "github.com/JustIkra/umir-gateway/internal/strictjson$"
            - "github.com/JustIkra/umir-gateway/tests/fixtures/catalog$"
  exclusions:
    presets: []
formatters:
  enable:
    - gofmt
    - goimports
