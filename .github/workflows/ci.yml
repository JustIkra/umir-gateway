name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned Go quality tools
        run: make tools
      - name: Test quality enforcement
        run: make quality-test
      - name: Repeat SSE expiry and timer race regressions
        env:
          GOWORK: 'off'
        run: go test -race -count=100 -timeout=90s ./internal/live -run 'Test(ExpiryEndsTheStreamAfterPeekConfirmsIt|AMovedDeadlineIsReportedInsteadOfAnEnd|TicksFollowTheMinuteAndPingsKeepTheStreamAlive|FakeClockNonPositiveTimerIsReadyWithoutAdvance)$'
      - name: Repeat production SSE handler regressions
        env:
          GOWORK: 'off'
        run: go test -race -count=10 -timeout=5m ./internal/live -run 'Test(G4|W1)'
      - name: Check Go quality
        run: make check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Check container build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: umir
          RABBITMQ_DEFAULT_PASS: umir-ci-only
        ports:
          - 55672:5672
          - 55673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Run integration tests on RabbitMQ and Redis
        env:
          GOWORK: 'off'
          UMIR_TEST_AMQP_URL: amqp://umir:umir-ci-only@127.0.0.1:55672/%2F
          UMIR_TEST_AMQP_MANAGEMENT_URL: http://umir:umir-ci-only@127.0.0.1:55673
          UMIR_TEST_REDIS_LIMITER_URL: redis://127.0.0.1:56379/0
        run: make integration

  publish:
    name: Publish image
    timeout-minutes: 30
    needs: [check, integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/justikra/umir-gateway:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

